[project]
name = "oim-shop"
version = "0.2.0"
description = "Northwind Traders' sales system: a FastAPI app over SQLite"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.161.0",
    "httpx2>=2.16.0",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
oim-shop = "oim_shop.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
# S101: pytest's assert is how tests check things.
per-file-ignores = { "tests/**" = ["S101"] }

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
