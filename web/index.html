<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Northwind Traders' sales system: products, customers, orders and sales." />
    <title>Northwind Sales</title>
    <script>
      // Apply the saved theme before the page paints, so a dark-mode reader never sees a white flash.
      // The same choice is managed afterwards by src/stores/theme.ts.
      try {
        const saved = JSON.parse(localStorage.getItem('oim-shop-theme') || '{}').state?.mode
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
