name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - name: The committed OpenAPI schema matches the code
        run: |
          uv run oim-shop openapi > ../web/openapi.json
          git diff --exit-code ../web/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: The generated API types match the committed schema
        run: |
          npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  # The production image, built and pushed only after every check above has passed on this
  # same commit. Only OIM7510/oim-shop publishes; its mirror, OIM6301/oim-shop, runs this
  # workflow too and must not push an image of its own. v3-dev is what the server runs until
  # v3 is merged into main; then it leaves the list.
  image:
    needs: [api, web, e2e]
    if: >-
      github.repository == 'OIM7510/oim-shop' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3-dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/oim7510/oim-shop
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build for the server (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64
          load: true
          tags: oim-shop:test
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 --memory 200m oim-shop:test
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/health
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          curl -sf 'localhost:8000/api/orders?per_page=1' | grep -q '"total"'
          docker stats --no-stream smoke
          docker rm -f smoke
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3-dev' }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
