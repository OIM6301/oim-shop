name: Image

# Builds the production image and pushes it to GitHub's container registry.
# Only OIM7510/oim-shop publishes; its mirror, OIM6301/oim-shop, runs the same
# workflows and must not push an image of its own.

on:
  push:
    # v2-dev is what the server runs until v2 is merged into main; then this branch leaves the list.
    branches: [main, v2-dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'OIM7510/oim-shop'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/oim7510/oim-shop
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build for the server (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64
          load: true
          tags: oim-shop:test
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 --memory 200m oim-shop:test
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/health
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          curl -sf 'localhost:8000/api/orders?per_page=1' | grep -q '"total"'
          docker stats --no-stream smoke
          docker rm -f smoke
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2-dev' }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
